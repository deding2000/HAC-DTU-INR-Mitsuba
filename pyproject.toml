[project]
name = "hac"
version = "0.1.0"
description = "Code related to the Helsinki Asteroid Challenge submissions by the team from the Technical University of Denmark (DTU)."
readme = "README.md"
authors = [
    { name = "Jeppe Klitgaard", email = "hi@jeppe.science" },
    { name = "Ishak Ayad", email = "ishak.ayad@centralesupelec.fr" },
    { name = "Christian Deding Nielsen", email = "cadni@dtu.dk"},
    { name = "David Wang Johansen", email = "s214743@dtu.dk"},
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "cholespy>=2.2.0",
    "cupy-cuda13x>=14.1.1",
    "gpytoolbox>=0.3.7",
    "imageio-ffmpeg>=0.6.0",
    "jax>=0.10.1",
    "matplotlib>=3.10.9",
    "mitsuba>=3.8.0",
    "numpy-stl[fast]>=4.0.0",
    "numpy>=2.1",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "rtree>=1.4.1",
    "scikit-image>=0.26.0",
    "scipy>=1.13",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "trimesh[recommend]>=4.12.2",
    "ujson5>=1.0.1",
    "meshio[all]>=5.3.5",
]

[dependency-groups]
dev = [
    "ipykernel<7",
    "marimo>=0.23.10",
    "ruff>=0.15.18",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
